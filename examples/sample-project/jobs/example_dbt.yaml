# bunsui job declaration (synced with `bunsui job sync`)
name: example_dbt
type: dbt
execution_mode: sync
depends_on: []
config:
  # build runs the model and its attached tests (run_results → assets)
  command: build
  select: example
  # dbt-only: native `dbt retry` after non-zero exit (default 0 = no retry).
  # run_results.json is always retained to ArtifactStore; restore only on retry.
  # Manual: `bunsui job retry <run_id>`
  # retries: 2
  # retry_delay_seconds: 2
