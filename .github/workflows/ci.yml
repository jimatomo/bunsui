name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sync (Python 3.14 via uv)
        run: uv sync
      - name: Test
        run: uv run pytest -q
      - name: Smoke init
        run: |
          uv run bunsui init /tmp/bunsui-ci --name ci
          test -f /tmp/bunsui-ci/.bunsui/control.sqlite
          uv run bunsui job sync --project /tmp/bunsui-ci
          uv run python -c "import sqlite3; c=sqlite3.connect('/tmp/bunsui-ci/.bunsui/control.sqlite'); n=c.execute('select count(*) from jobs where enabled=1').fetchone()[0]; assert n>=2, n"
          uv run bunsui job run example_python --project /tmp/bunsui-ci
          uv run python -c "
import sqlite3
c=sqlite3.connect('/tmp/bunsui-ci/.bunsui/control.sqlite')
names=[r[0] for r in c.execute('select j.name from job_runs r join jobs j on j.id=r.job_id order by r.created_at, r.id')]
assert names==['example_dbt','example_python'], names
assert all(r[0]=='succeeded' for r in c.execute('select status from job_runs'))
n=c.execute('select count(*) from assets').fetchone()[0]
assert n>=1, n
"
          uv run bunsui job run example_python --no-deps --project /tmp/bunsui-ci
          uv run python -c "
import sqlite3
c=sqlite3.connect('/tmp/bunsui-ci/.bunsui/control.sqlite')
names=[r[0] for r in c.execute('select j.name from job_runs r join jobs j on j.id=r.job_id order by r.created_at, r.id')]
assert names==['example_dbt','example_python','example_python'], names
"
          uv run bunsui job run example_python_async --project /tmp/bunsui-ci
          uv run python -c "import sqlite3; c=sqlite3.connect('/tmp/bunsui-ci/.bunsui/control.sqlite'); r=c.execute(\"select status from job_runs order by created_at desc limit 1\").fetchone(); assert r and r[0]=='succeeded', r"
          uv run bunsui job run example_dbt --no-deps --project /tmp/bunsui-ci
          uv run python -c "
import sqlite3
c=sqlite3.connect('/tmp/bunsui-ci/.bunsui/control.sqlite')
r=c.execute('select id, status from job_runs order by created_at desc limit 1').fetchone()
assert r and r[1]=='succeeded', r
log=c.execute('select path from logs where job_run_id=?', (r[0],)).fetchone()
assert log and log[0], log
n=c.execute('select count(*) from assets').fetchone()[0]
assert n>=1, n
model=c.execute(\"select asset_key, status from assets where asset_type='model' limit 1\").fetchone()
assert model and 'example' in model[0] and model[1]=='materialized', model
art=c.execute('select path from artifacts where job_run_id=?', (r[0],)).fetchone()
assert art and art[0], art
"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test API
        run: bun test
