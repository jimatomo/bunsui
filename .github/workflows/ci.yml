name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sync (Python 3.14 via uv)
        run: uv sync
      - name: Test
        run: uv run pytest -q
      - name: Smoke init
        run: |
          uv run bunsui init /tmp/bunsui-ci --name ci
          test -f /tmp/bunsui-ci/.bunsui/control.sqlite

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test API
        run: bun test
