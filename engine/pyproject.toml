[project]
name = "bunsui"
version = "2.0.0a0"
description = "Local data platform: DuckDB warehouse, dbt transforms, SQLite control plane"
readme = "README.md"
authors = [
    { name = "Jima (Tomoyuki Iijima)", email = "jimatomo@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.14"
keywords = ["duckdb", "dbt", "sqlite", "data-platform", "local"]
dependencies = [
    "click>=8.5.0",
    "duckdb>=1.5.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
bunsui = "bunsui.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.uv]
package = true
